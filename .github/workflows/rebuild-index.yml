name: Rebuild Knowledge Base Index

on:
  schedule:
    - cron: "0 2 * * 0"  # weekly on Sunday at 02:00 UTC
  workflow_dispatch:
    inputs:
      reset_index:
        description: "Reset ChromaDB and rebuild from scratch"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  rebuild:
    name: Rebuild Knowledge Base
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e .

      - name: Restore cached raw data
        uses: actions/cache@v4
        id: cache-raw
        with:
          path: data/raw/
          key: chipathon-raw-${{ hashFiles('chatbot/ingest/scraper.py') }}-${{ github.run_number }}
          restore-keys: |
            chipathon-raw-${{ hashFiles('chatbot/ingest/scraper.py') }}-
            chipathon-raw-

      - name: Fetch documents
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.cache-raw.outputs.cache-hit }}" != "true" ]; then
            python -m chatbot.ingest.scraper --output-dir data/raw
          else
            echo "Cache hit — skipping scrape"
          fi

      - name: Chunk documents
        run: python -m chatbot.ingest.chunker

      - name: Embed and index
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          RESET_FLAG=""
          if [ "${{ github.event.inputs.reset_index }}" = "true" ]; then
            RESET_FLAG="--reset"
          fi
          python -m chatbot.ingest.embedder $RESET_FLAG

      - name: Upload vectorstore artifact
        uses: actions/upload-artifact@v4
        with:
          name: chipathon-vectorstore-${{ github.sha }}
          path: data/vectorstore/
          retention-days: 90

      - name: Job summary
        run: |
          echo "## Knowledge Base Rebuilt" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date -u)" >> $GITHUB_STEP_SUMMARY
