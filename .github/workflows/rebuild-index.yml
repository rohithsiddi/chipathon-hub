name: Rebuild Chipathon Knowledge Base Index

on:
  # Trigger when docs change
  push:
    branches: [main]
    paths:
      - "hub/docs/**"
      - "chatbot/eval/questions.json"
  # Scheduled refresh during Chipathon season (weekly)
  schedule:
    - cron: "0 2 * * 0"   # Every Sunday at 02:00 UTC
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      reset_index:
        description: "Reset and rebuild ChromaDB from scratch"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  rebuild-index:
    name: Rebuild Knowledge Base
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv pip install -e . --system

      - name: Restore cached raw data (GitHub content)
        uses: actions/cache@v4
        id: cache-raw
        with:
          path: data/raw/
          key: chipathon-raw-${{ hashFiles('chatbot/ingest/scraper.py') }}-${{ github.run_number }}
          restore-keys: |
            chipathon-raw-${{ hashFiles('chatbot/ingest/scraper.py') }}-
            chipathon-raw-

      - name: Fetch documents (skip if cached)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.cache-raw.outputs.cache-hit }}" != "true" ]; then
            echo "Cache miss — running full scrape"
            python -m chatbot.ingest.scraper --output-dir data/raw
          else
            echo "Cache hit — skipping scrape"
          fi

      - name: Chunk documents
        run: python -m chatbot.ingest.chunker

      - name: Embed and index (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          RESET_FLAG=""
          if [ "${{ github.event.inputs.reset_index }}" = "true" ]; then
            RESET_FLAG="--reset"
            echo "Full index reset requested"
          fi
          python -m chatbot.ingest.embedder $RESET_FLAG

      - name: Upload ChromaDB artifact
        uses: actions/upload-artifact@v4
        with:
          name: chipathon-vectorstore-${{ github.sha }}
          path: data/vectorstore/
          retention-days: 90

      - name: Summary
        run: |
          echo "## Knowledge Base Rebuilt ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY

  deploy-hub:
    name: Deploy Knowledge Hub to GitHub Pages
    runs-on: ubuntu-latest
    needs: rebuild-index
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install MkDocs dependencies
        run: uv pip install mkdocs mkdocs-material pymdown-extensions --system

      - name: Build MkDocs site
        run: |
          cd hub
          mkdocs build --strict

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: hub/site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
